<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invenio Agency — Social Media Assets Preview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            flex-direction: column;
            gap: 60px;
            min-height: auto;
            padding: 60px 40px;
            overflow: auto;
            align-items: center;
        }

        h1 {
            font-family: var(--serif);
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 0.06em;
            color: var(--cream);
            margin-bottom: 20px;
        }

        .asset-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .label {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--mid);
        }

        iframe {
            border: 1px solid var(--teal);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
        }

        .fb-frame {
            width: 851px;
            height: 315px;
        }

        .ig-frame {
            width: 1080px;
            height: 1080px;
            transform: scale(0.6);
            transform-origin: top center;
        }

        .ig-container {
            width: 648px;
            height: 648px;
            overflow: hidden;
        }

        .thumb-frame {
            width: 1280px;
            height: 720px;
            transform: scale(0.6);
            transform-origin: top center;
        }

        .thumb-container {
            width: 768px;
            height: 432px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h1>Invenio — Activos de Redes Sociales</h1>

    <div class="asset-group">
        <span class="label">Miniatura de Video (Caso de Estudio) — Widescreen 16:9 (Escala 60%)</span>
        <div class="thumb-container">
            <iframe src="video-thumbnail.html" class="thumb-frame" scrolling="no"></iframe>
        </div>
    </div>

    <div class="asset-group">
        <span class="label">Portada de Facebook — 851 × 315 px</span>
        <iframe src="facebook-cover.html" class="fb-frame" scrolling="no"></iframe>
    </div>

    <div class="asset-group">
        <span class="label">Publicación de Instagram — 1080 × 1080 px (Escala 60%)</span>
        <div class="ig-container">
            <iframe src="instagram-post.html" class="ig-frame" scrolling="no"></iframe>
        </div>
    </div>
</body>
</html>
