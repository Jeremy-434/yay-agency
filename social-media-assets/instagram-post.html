<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invenio Agency — Instagram Post</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Instagram Post: 1080 × 1080 px */
        .canvas {
            width: 1080px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 72px 80px;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            font-family: 'Crimson Pro', serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--mid);
        }

        /* Center block */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 40px;
            position: relative;
            z-index: 2;
        }

        .logo-img {
            width: 260px;
            height: auto;
        }

        .brand-name {
            font-family: 'Crimson Pro', serif;
            font-size: 96px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--cream);
            line-height: 1;
            margin: 0;
        }

        .tagline {
            font-family: 'Crimson Pro', serif;
            font-size: 26px;
            font-weight: 300;
            font-style: italic;
            color: var(--sage);
            line-height: 1.5;
            max-width: 600px;
        }

        /* Glass panel behind center */
        .glass-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 860px;
            height: 700px;
            background: rgba(18, 69, 89, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(174, 195, 176, 0.05);
            border-radius: 48px;
            z-index: 1;
        }

        /* Bottom bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 2;
        }

        .bottom-label {
            font-family: 'Crimson Pro', serif;
            font-size: 12px;
            color: var(--mid);
            opacity: 0.5;
            letter-spacing: 0.1em;
        }

        /* Orbs */
        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--teal);
            top: -150px;
            right: -150px;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: var(--mid);
            bottom: -100px;
            left: -100px;
            opacity: 0.15;
        }
    </style>
</head>

<body>
    <div class="canvas">
        <!-- Diagonal stripe bg -->
        <div class="stripe-bg"></div>

        <!-- Orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <!-- Glass panel -->
        <div class="glass-panel"></div>

        <!-- Top eyebrow -->
        <div class="top-bar">
            <span class="eyebrow">Automatización Inteligente</span>
            <span class="eyebrow">2026</span>
        </div>

        <!-- Center: Logo + Wordmark -->
        <div class="center-block">
            <!-- Actual Invenio Logo from astro-app/public/logo -->
            <img class="logo-img" src="../astro-app/public/logo/Invenio Logo Vector Light 1.svg" alt="Invenio Logo" />

            <h1 class="brand-name">Invenio</h1>

            <p class="tagline">Del descubrimiento al cierre, sin fricción.</p>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <span class="bottom-label">invenioagency.com</span>
            <span class="bottom-label">@invenioagency</span>
        </div>
    </div>
</body>

</html>
