<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#0b0e14" />
  
  <!-- Astro (The "Core") -->
  <circle cx="400" cy="200" r="100" fill="#ff5d01" opacity="0.1" />
  <path d="M400 120 L440 220 L400 200 L360 220 Z" fill="#ff5d01" />
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">ASTRO</text>
  
  <!-- Sanity (The "Content Lake") -->
  <rect x="50" y="150" width="120" height="100" rx="10" fill="#f03e2f" opacity="0.8" />
  <text x="110" y="210" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">SANITY</text>
  <path d="M170 200 Q285 200 400 200" stroke="#f03e2f" stroke-width="2" stroke-dasharray="5,5" fill="none" />
  
  <!-- React (The "UI") -->
  <ellipse cx="650" cy="200" rx="80" ry="30" stroke="#61dafb" stroke-width="2" fill="none" />
  <ellipse cx="650" cy="200" rx="80" ry="30" stroke="#61dafb" stroke-width="2" fill="none" transform="rotate(60 650 200)" />
  <ellipse cx="650" cy="200" rx="80" ry="30" stroke="#61dafb" stroke-width="2" fill="none" transform="rotate(120 650 200)" />
  <circle cx="650" cy="200" r="10" fill="#61dafb" />
  <text x="650" y="260" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">REACT</text>
  
  <!-- GSAP (The "Motion") -->
  <path d="M400 300 Q400 350 500 350 T600 300" stroke="#88ce02" stroke-width="4" fill="none" />
  <text x="500" y="380" font-family="Arial, sans-serif" font-size="16" fill="#88ce02" text-anchor="middle" font-weight="bold">GSAP ANIMATIONS</text>
  
  <!-- Tailwind (The "Style") -->
  <path d="M200 50 Q300 100 400 50 T600 50" stroke="#38bdf8" stroke-width="4" fill="none" />
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="bold">TAILWIND CSS v4</text>
  
  <!-- Connections -->
  <path d="M400 200 L650 200" stroke="white" stroke-width="1" opacity="0.3" />
</svg>